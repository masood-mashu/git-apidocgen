spec_version: "0.1.0"
name: git-apidocgen
version: 1.0.0
description: "Autonomous OpenAPI 3.1 Spec Synthesis, Route AST Coverage & Executable cURL Generator"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - openapi-31-specification
  - api-contract-testing

tools:
  - openapi-spec-synthesizer
  - status-code-coverage-checker
  - curl-example-generator

runtime:
  max_turns: 50
  timeout: 120

tags:
  - developer-tools
  - openapi
  - api-documentation
  - swagger
  - passport-challenge

metadata:
  passport_id: "aps-apidocgen-01"
  passport_category: "Developer tools"
