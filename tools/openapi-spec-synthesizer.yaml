name: openapi-spec-synthesizer
version: 1.0.0
description: "Generates valid OpenAPI 3.1.0 schema document from list of endpoints and methods"
input_schema:
  type: object
  properties:
    endpoints_json:
      type: string
      description: "JSON list of endpoint paths and HTTP methods"
  required:
    - endpoints_json
implementation:
  type: script
  path: openapi_spec_synthesizer.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
